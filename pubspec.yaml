name: fermata
description: "Fermata — a premium cross-platform music player"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State, routing, DI
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1

  # Audio
  just_audio: ^0.10.6          # Android backend (ExoPlayer / Media3)
  audio_service: ^0.18.19      # Android foreground media service + MediaSession
  audio_session: ^0.2.4        # Audio focus, interruptions, becoming-noisy
  media_kit: ^1.2.6            # Desktop backend (libmpv)
  media_kit_libs_linux: ^1.2.1          # libmpv on Linux (Android uses just_audio)
  media_kit_libs_windows_audio: ^1.0.9

  # Desktop integration
  window_manager: ^0.5.2
  tray_manager: ^0.8.0
  hotkey_manager: ^0.2.3
  win32_registry: ^3.0.3      # Windows startup-on-login (HKCU Run key)
  dbus: ^0.8.0                 # Linux MPRIS server
  smtc_windows: ^1.1.0         # Windows System Media Transport Controls

  # Storage & platform
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.5
  sqlite3: ^3.8.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  connectivity_plus: ^7.3.2
  permission_handler: ^13.0.2
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0
  file_picker: ^13.3.0
  watcher: ^1.2.1

  # Network & auth
  http: ^1.6.0
  app_links: ^7.2.2           # Android OAuth redirect (custom scheme deep link)
  url_launcher: ^6.3.3
  crypto: ^3.0.8

  # Media metadata & UI helpers
  audio_metadata_reader: ^1.8.1
  cached_network_image: ^4.0.5
  flutter_svg: ^2.3.0

  # Utilities
  intl: ^0.20.3
  uuid: ^4.6.0
  collection: ^1.19.1
  path: ^1.9.1
  mime: ^2.1.0
  logging: ^1.3.0
  screen_retriever: ^0.2.2
  flutter_cache_manager: ^3.4.6
  file: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true
